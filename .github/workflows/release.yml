# Publishes to npm with provenance using GitHub OIDC trusted publishing.
# Nothing here runs until a maintainer pushes a version tag (v*).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: install and verify npm CLI
        run: |
          npm install -g npm@^11.5.1
          npm --version
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const version = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim();
          const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
          if (!match) throw new Error(`Unexpected npm version: ${version}`);
          const actual = match.slice(1).map(Number);
          const minimum = [11, 5, 1];
          const difference = actual.findIndex((value, index) => value !== minimum[index]);
          if (difference !== -1 && actual[difference] < minimum[difference]) {
            throw new Error(`npm >= 11.5.1 required; got ${version}`);
          }
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
